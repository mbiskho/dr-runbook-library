[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rblint"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml==6.0.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
rblint = "rblint.cli:main"

[tool.setuptools.packages.find]
include = ["rblint*"]
