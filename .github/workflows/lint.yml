name: runbook-lint
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1"   # weekly: runbooks go stale even when nobody edits them
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: rblint runbooks/ --index runbooks/INDEX.md
